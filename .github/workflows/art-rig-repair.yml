name: Repair authored rig frames
on:
  push:
    branches: [art/blender-godot-pipeline]
    paths: [.github/workflows/art-rig-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed rest-frame repair and its regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('art/tools/build_assets.py')
          s=p.read_text()
          replacements=[
            ("def orient(a,b):\n    a,b=Vector(a),Vector(b); return Matrix.Translation(a) @ (b-a).to_track_quat('Y','Z').to_matrix().to_4x4()",
             "def orient(a,b,rest):\n    # Preserve authored rest roll; a vertical track-Y/up-Z frame is singular.\n    a,b=Vector(a),Vector(b)\n    basis=rest.to_3x3()\n    delta=basis.col[1].normalized().rotation_difference((b-a).normalized())\n    return Matrix.Translation(a) @ delta.to_matrix().to_4x4() @ basis.to_4x4()"),
            ("a,b,_=spec[n]; mats[n]=orient(torso_point(a),torso_point(b))",
             "a,b,_=spec[n]; mats[n]=Matrix.Translation(torso_point(a)) @ bodyrot @ arm.data.bones[n].matrix_local.to_3x3().to_4x4()"),
            ("mats['arm.'+s]=orient(a,elbow); mats['forearm.'+s]=orient(elbow,target)",
             "mats['arm.'+s]=orient(a,elbow,bodyrot @ arm.data.bones['arm.'+s].matrix_local); mats['forearm.'+s]=orient(elbow,target,bodyrot @ arm.data.bones['forearm.'+s].matrix_local)"),
            ("mats['hand.'+s]=orient(target,target+direction*.10)",
             "mats['hand.'+s]=orient(target,target+direction*.10,bodyrot @ arm.data.bones['hand.'+s].matrix_local)"),
            ("mats['thigh.'+s]=orient(hip,knee); mats['shin.'+s]=orient(knee,foot)",
             "mats['thigh.'+s]=orient(hip,knee,arm.data.bones['thigh.'+s].matrix_local); mats['shin.'+s]=orient(knee,foot,arm.data.bones['shin.'+s].matrix_local)"),
            ("mats['foot.'+s]=orient(foot,foot+Vector((0,-.22,-.035)))",
             "mats['foot.'+s]=orient(foot,foot+Vector((0,-.22,-.035)),arm.data.bones['foot.'+s].matrix_local)"),
            ("a,b,_=spec['scarf']; mats['scarf']=orient(torso_point(a),torso_point(b)+Vector((math.sin(f*.1)*.04,.025,0)))",
             "a,b,_=spec['scarf']; mats['scarf']=orient(torso_point(a),torso_point(b)+Vector((math.sin(f*.1)*.04,.025,0)),bodyrot @ arm.data.bones['scarf'].matrix_local)")]
          for old,new in replacements:
              assert s.count(old)==1, 'Expected generator context changed: '+old
              s=s.replace(old,new)
          p.write_text(s)
          p=Path('godot/tests/assets.gd')
          s=p.read_text()
          old='\t\tactor.free()'
          new='\n'.join([
              '\t\tactor.sample("Idle",0.0)', '\t\tactor.sample("Idle",0.2)',
              '\t\tvar head_bone: int = actor.skeleton.find_bone("head")',
              '\t\tvar idle_right: Vector3 = actor.skeleton.get_bone_global_pose(head_bone).basis.x.normalized()',
              '\t\tactor.sample("Run",0.0)', '\t\tactor.sample("Run",0.2)',
              '\t\tvar run_right: Vector3 = actor.skeleton.get_bone_global_pose(head_bone).basis.x.normalized()',
              '\t\texpect(idle_right.dot(run_right) > 0.95, id+": idle/run head roll remains continuous")',old])
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - name: Install pinned Blender and Godot
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libxi6 libxfixes3 libxrender1 libxkbcommon0
          curl -fL --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz -o /tmp/blender.tar.xz
          echo '96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48  /tmp/blender.tar.xz' | sha256sum -c -
          tar -xf /tmp/blender.tar.xz -C /tmp
          sudo ln -s /tmp/blender-5.2.0-linux-x64/blender /usr/local/bin/blender
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p artifacts
      - name: Prove the new regression detects the old clip fault
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --editor --import --quit > artifacts/import-before.log 2>&1
          if godot --headless --path godot --script res://tests/assets.gd > artifacts/before.log 2>&1; then
            echo 'Regression unexpectedly passes against old exports'; exit 1
          fi
          grep -q 'idle/run head roll remains continuous' artifacts/before.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/before.log; then exit 1; fi
      - name: Rebuild corrected assets and verify
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 2 --python art/tools/build_assets.py -- --root "$PWD" --render 2>&1 | tee artifacts/blender.log
          grep -q 'SENJIN_ASSETS_PASS 21' artifacts/blender.log
          python3 art/tools/verify_exports.py | tee artifacts/glb-contract.log
          godot --headless --path godot --editor --import --quit > artifacts/import-after.log 2>&1
          godot --headless --path godot --script res://tests/assets.gd 2>&1 | tee artifacts/after.log
          grep -q SENJIN_ASSET_TESTS_PASS artifacts/after.log
          godot --headless --path godot --script res://tests/run.gd 2>&1 | tee artifacts/regression.log
          grep -q SENJIN_TESTS_PASS artifacts/regression.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/import-after.log artifacts/after.log artifacts/regression.log; then exit 1; fi
          timeout 120 xvfb-run -a godot --path godot --audio-driver Dummy --script res://tests/asset_visual.gd -- "--capture=$PWD/art/previews/characters-godot.png" 2>&1 | tee artifacts/visual.log
          grep -q SENJIN_ASSET_VISUAL_PASS artifacts/visual.log
          timeout 180 xvfb-run -a godot --path godot --audio-driver Dummy -- --smoke --touch "--capture=$PWD/art/previews/native-gameplay.png" 2>&1 | tee artifacts/gameplay.log
          grep -q SENJIN_SMOKE_PASS artifacts/gameplay.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/visual.log artifacts/gameplay.log; then exit 1; fi
      - name: Publish reviewed source fix and matching generated assets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/art/blender-godot-pipeline
          git fetch origin art/blender-godot-pipeline
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || { echo 'Branch moved; refusing overwrite'; exit 1; }
          git add -- art/tools/build_assets.py godot/tests/assets.gd art/blender/*.blend godot/assets/models/*.glb godot/assets/models/*.glb.import godot/assets/models/manifest.json art/previews/*.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve rest-bone roll and rebuild all authored clips; cover idle/run continuity'
          git push origin HEAD:refs/heads/art/blender-godot-pipeline
          git rev-parse HEAD > artifacts/generated-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senjin-rig-validated-${{ github.sha }}
          path: |
            art/blender/*.blend
            art/previews/*.png
            art/LICENSE
            godot/assets/models/
            artifacts/
          retention-days: 14
