name: Realism authoring workspace
on:
  push:
    branches: [art/realistic-pbr-pass]
    paths: [.github/workflows/realism-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    if: github.ref == 'refs/heads/art/realistic-pbr-pass'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked authoring sources and native verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/realism-workspace
          git archive --format=tar HEAD | gzip > /tmp/realism-workspace/SENJIN-source.tar.gz
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/realism-workspace/godot.zip
          sha256sum /tmp/realism-workspace/* > /tmp/realism-workspace/SHA256SUMS
          git rev-parse HEAD > /tmp/realism-workspace/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: realism-authoring-workspace
          path: /tmp/realism-workspace/
          retention-days: 1
