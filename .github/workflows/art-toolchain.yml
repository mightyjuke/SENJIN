name: Art authoring toolchain
on:
  push:
    branches: [art/blender-godot-pipeline]
    paths: [.github/workflows/art-toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare offline verification workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/senjin-tools
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/senjin-tools
          git archive HEAD | gzip > /tmp/senjin-tools/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: senjin-art-toolchain
          path: /tmp/senjin-tools/
          retention-days: 3
